name: controle_lotacao_biblioteca
description: Aplicativo Flutter para controle de lotacao de uma biblioteca.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_slidable: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/biblioteca.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icone_biblioteca.png
  min_sdk_android: 21
